[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-simulator"
version = "0.1.0"
description = "MuJoCo origami folding simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "matplotlib>=3.7",
    "mujoco>=2.3",
    "numpy>=1.24",
    "shapely>=2.0",
    "imageio[ffmpeg]>=2.34",
]

[project.scripts]
origami-render = "origami_engine.render_individual:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["origami_engine*"]

[tool.setuptools.package-data]
origami_engine = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
files = ["origami_engine"]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
